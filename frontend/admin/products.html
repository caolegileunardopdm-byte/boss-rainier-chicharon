<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Products - Admin</title>
    <link rel="stylesheet" href="../css/style.css" />
    <style>
      .admin-container {
        max-width: 1200px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      .admin-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
        flex-wrap: wrap;
        gap: 1rem;
      }
      .admin-header h1 {
        color: var(--primary);
        font-size: 2rem;
      }
      .products-table {
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        overflow: hidden;
      }
      .products-table table {
        width: 100%;
        border-collapse: collapse;
      }
      .products-table th {
        background: var(--primary);
        color: white;
        padding: 1rem;
        text-align: left;
        font-weight: 600;
        font-size: 0.9rem;
      }
      .products-table td {
        padding: 1rem;
        border-bottom: 1px solid var(--gray-200);
        font-size: 0.95rem;
      }
      .products-table tr:last-child td {
        border-bottom: none;
      }
      .products-table tr:hover {
        background: var(--gray-50);
      }
      .action-btns {
        display: flex;
        gap: 0.5rem;
      }
      .btn-sm {
        padding: 0.4rem 0.8rem;
        font-size: 0.85rem;
        border-radius: 6px;
      }
      .btn-edit {
        background: #3b82f6;
        color: white;
      }
      .btn-edit:hover {
        background: #2563eb;
        color: white;
      }
      .btn-delete {
        background: var(--danger);
        color: white;
      }
      .btn-delete:hover {
        background: #dc2626;
        color: white;
      }
      .badge {
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        font-size: 0.8rem;
        font-weight: 600;
      }
      .badge-success {
        background: #d1fae5;
        color: #065f46;
      }
      .badge-danger {
        background: #fee2e2;
        color: #991b1b;
      }
      /* Modal */
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }
      .modal.show {
        display: flex;
      }
      .modal-content {
        background: white;
        border-radius: 12px;
        padding: 2rem;
        max-width: 500px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
      }
      .modal-header h2 {
        color: var(--primary);
        font-size: 1.5rem;
      }
      .modal-close {
        background: none;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;
        color: var(--text-light);
      }
      .form-group {
        margin-bottom: 1rem;
      }
      .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        font-size: 0.9rem;
      }
      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 0.65rem 0.85rem;
        border: 2px solid var(--gray-200);
        border-radius: 8px;
        font-size: 0.95rem;
        font-family: inherit;
        box-sizing: border-box;
      }
      .form-group input:focus,
      .form-group textarea:focus {
        outline: none;
        border-color: var(--primary);
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }
      .modal-actions {
        display: flex;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }
      .alert {
        padding: 0.75rem 1rem;
        border-radius: 8px;
        margin-bottom: 1rem;
        display: none;
      }
      .alert.show {
        display: block;
      }
      .alert-success {
        background: #d1fae5;
        color: #065f46;
        border: 1px solid #6ee7b7;
      }
      .alert-danger {
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fca5a5;
      }
    </style>
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar">
      <a href="../index.html" class="navbar-brand">🥓 Boss Rainier Chicharon</a>
      <ul class="navbar-nav">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="orders.html">Orders</a></li>
        <li><a href="inventory.html">Inventory</a></li>
        <li><a href="users.html">Users</a></li>
        <li><a href="payments.html">Payments</a></li>
        <li>
          <a
            href="#"
            onclick="
              logout();
              return false;
            "
            >Logout</a
          >
        </li>
      </ul>
    </nav>

    <!-- ADMIN PRODUCTS -->
    <div class="admin-container">
      <div class="admin-header">
        <h1>📦 Manage Products</h1>
        <button class="btn btn-primary" onclick="openAddModal()">
          + Add Product
        </button>
      </div>

      <div id="alert" class="alert"></div>

      <div class="products-table">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Category</th>
              <th>Price</th>
              <th>Stock</th>
              <th>Barcode</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="products-body">
            <tr>
              <td colspan="6" style="text-align: center; padding: 2rem">
                Loading...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- ADD/EDIT MODAL -->
    <div id="product-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modal-title">Add Product</h2>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>

        <form id="product-form" onsubmit="saveProduct(event)">
          <input type="hidden" id="product-id" />

          <div class="form-group">
            <label for="product-name">Product Name *</label>
            <input type="text" id="product-name" required />
          </div>

          <div class="form-group">
            <label for="product-description">Description</label>
            <textarea id="product-description" rows="2"></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="product-price">Price (₱) *</label>
              <input
                type="number"
                id="product-price"
                step="0.01"
                min="0"
                required
              />
            </div>
            <div class="form-group">
              <label for="product-stock">Stock Quantity *</label>
              <input type="number" id="product-stock" min="0" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="product-barcode">Barcode</label>
              <input type="text" id="product-barcode" />
            </div>
            <div class="form-group">
              <label for="product-category">Category</label>
              <select
                id="product-category"
                style="
                  width: 100%;
                  padding: 0.65rem 0.85rem;
                  border: 2px solid var(--gray-200);
                  border-radius: 8px;
                  font-size: 0.95rem;
                "
              >
                <option value="">No category</option>
              </select>
            </div>
          </div>

          <div class="modal-actions">
            <button
              type="button"
              class="btn btn-secondary"
              onclick="closeModal()"
              style="flex: 1"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary" style="flex: 1">
              Save
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
      <p>© 2026 Boss Rainier Chicharon. All rights reserved.</p>
    </footer>

    <script src="../js/config.js"></script>
    <script src="../js/admin/admin-auth.js"></script>
    <script src="../js/admin/admin-products.js"></script>
  </body>
</html>
