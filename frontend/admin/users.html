<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Users - Admin</title>
    <link rel="stylesheet" href="../css/style.css" />
    <style>
      .admin-container {
        max-width: 1200px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      .admin-header {
        margin-bottom: 2rem;
      }
      .admin-header h1 {
        color: var(--primary);
        font-size: 2rem;
        margin-bottom: 0.5rem;
      }
      .admin-header p {
        color: var(--text-light);
      }
      .filter-tabs {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
      }
      .filter-tab {
        padding: 0.5rem 1rem;
        border-radius: 8px;
        border: 2px solid var(--gray-200);
        background: white;
        color: var(--text-dark);
        cursor: pointer;
        font-weight: 500;
        transition: all 0.2s;
        font-size: 0.9rem;
      }
      .filter-tab:hover {
        border-color: var(--primary);
        color: var(--primary);
      }
      .filter-tab.active {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }
      .users-table {
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        overflow: hidden;
      }
      .users-table table {
        width: 100%;
        border-collapse: collapse;
      }
      .users-table th {
        background: var(--primary);
        color: white;
        padding: 1rem;
        text-align: left;
        font-weight: 600;
        font-size: 0.85rem;
      }
      .users-table td {
        padding: 1rem;
        border-bottom: 1px solid var(--gray-200);
        font-size: 0.9rem;
      }
      .users-table tr:last-child td {
        border-bottom: none;
      }
      .users-table tr:hover {
        background: var(--gray-50);
      }
      .role-badge {
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: capitalize;
      }
      .role-admin {
        background: #fee2e2;
        color: #991b1b;
      }
      .role-staff {
        background: #dbeafe;
        color: #1e40af;
      }
      .role-customer {
        background: #d1fae5;
        color: #065f46;
      }
      .action-btns {
        display: flex;
        gap: 0.35rem;
        flex-wrap: wrap;
      }
      .btn-sm {
        padding: 0.35rem 0.65rem;
        font-size: 0.8rem;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        font-weight: 500;
        transition: all 0.2s;
      }
      .btn-edit {
        background: #3b82f6;
        color: white;
      }
      .btn-edit:hover {
        background: #2563eb;
      }
      .btn-delete {
        background: var(--danger);
        color: white;
      }
      .btn-delete:hover {
        background: #dc2626;
      }
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }
      .modal.show {
        display: flex;
      }
      .modal-content {
        background: white;
        border-radius: 12px;
        padding: 2rem;
        max-width: 500px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
      }
      .modal-header h2 {
        color: var(--primary);
        font-size: 1.5rem;
      }
      .modal-close {
        background: none;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;
        color: var(--text-light);
      }
      .form-group {
        margin-bottom: 1rem;
      }
      .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        font-size: 0.9rem;
      }
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 0.65rem 0.85rem;
        border: 2px solid var(--gray-200);
        border-radius: 8px;
        font-size: 0.95rem;
        font-family: inherit;
        box-sizing: border-box;
      }
      .form-group input:focus,
      .form-group select:focus {
        outline: none;
        border-color: var(--primary);
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }
      .modal-actions {
        display: flex;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }
      .alert {
        padding: 0.75rem 1rem;
        border-radius: 8px;
        margin-bottom: 1rem;
        display: none;
      }
      .alert.show {
        display: block;
      }
      .alert-success {
        background: #d1fae5;
        color: #065f46;
        border: 1px solid #6ee7b7;
      }
      .alert-danger {
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fca5a5;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <a href="../index.html" class="navbar-brand">🥓 Boss Rainier Chicharon</a>
      <ul class="navbar-nav">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="orders.html">Orders</a></li>
        <li><a href="inventory.html">Inventory</a></li>
        <li><a href="users.html">Users</a></li>
        <li><a href="payments.html">Payments</a></li>
        <li>
          <a
            href="#"
            onclick="
              logout();
              return false;
            "
            >Logout</a
          >
        </li>
      </ul>
    </nav>

    <div class="admin-container">
      <div class="admin-header">
        <h1>👥 Manage Users</h1>
        <p>View and manage user accounts</p>
      </div>

      <div id="alert" class="alert"></div>

      <div class="filter-tabs" id="filter-tabs">
        <button class="filter-tab active" data-role="all">All Users</button>
        <button class="filter-tab" data-role="customer">Customers</button>
        <button class="filter-tab" data-role="staff">Staff</button>
        <button class="filter-tab" data-role="admin">Admins</button>
      </div>

      <div class="users-table">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Username</th>
              <th>Role</th>
              <th>Phone</th>
              <th>Joined</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="users-body">
            <tr>
              <td colspan="7" style="text-align: center; padding: 2rem">
                Loading...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div id="user-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modal-title">Edit User</h2>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <form id="user-form" onsubmit="saveUser(event)">
          <input type="hidden" id="user-id" />
          <div class="form-group">
            <label for="user-fullname">Full Name *</label>
            <input type="text" id="user-fullname" required />
          </div>
          <div class="form-group">
            <label for="user-email">Email *</label>
            <input type="email" id="user-email" required />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="user-username">Username *</label>
              <input type="text" id="user-username" required />
            </div>
            <div class="form-group">
              <label for="user-phone">Phone</label>
              <input type="text" id="user-phone" />
            </div>
          </div>
          <div class="form-group">
            <label for="user-address">Address</label>
            <input type="text" id="user-address" />
          </div>
          <div class="form-group">
            <label for="user-role">Role *</label>
            <select id="user-role" required>
              <option value="customer">Customer</option>
              <option value="staff">Staff</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="modal-actions">
            <button
              type="button"
              class="btn btn-secondary"
              onclick="closeModal()"
              style="flex: 1"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary" style="flex: 1">
              Save
            </button>
          </div>
        </form>
      </div>
    </div>

    <footer class="footer">
      <p>© 2026 Boss Rainier Chicharon. All rights reserved.</p>
    </footer>

    <script src="../js/config.js"></script>
    <script src="../js/admin/admin-auth.js"></script>
    <script src="../js/admin/admin-users.js"></script>
  </body>
</html>
