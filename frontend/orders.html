<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Orders - Boss Rainier Chicharon</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .orders-container {
        max-width: 900px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      .orders-header {
        margin-bottom: 2rem;
      }
      .orders-header h1 {
        color: var(--primary);
        font-size: 2rem;
        margin-bottom: 0.5rem;
      }
      .orders-header p {
        color: var(--text-light);
      }
      .order-card {
        background: white;
        border-radius: 12px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        transition: box-shadow 0.2s;
      }
      .order-card:hover {
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      }
      .order-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 1rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--gray-200);
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .order-id {
        font-family: monospace;
        color: var(--text-light);
        font-size: 0.85rem;
      }
      .order-date {
        color: var(--text-light);
        font-size: 0.9rem;
      }
      .order-status {
        padding: 0.35rem 0.9rem;
        border-radius: 9999px;
        font-size: 0.85rem;
        font-weight: 600;
        text-transform: capitalize;
      }
      .status-pending {
        background: #fef3c7;
        color: #92400e;
      }
      .status-confirmed {
        background: #dbeafe;
        color: #1e40af;
      }
      .status-ready {
        background: #e0e7ff;
        color: #4338ca;
      }
      .status-completed {
        background: #d1fae5;
        color: #065f46;
      }
      .status-cancelled {
        background: #fee2e2;
        color: #991b1b;
      }
      .order-items {
        margin-bottom: 1rem;
      }
      .order-item {
        display: flex;
        justify-content: space-between;
        padding: 0.5rem 0;
        color: var(--text-dark);
      }
      .order-item-name {
        font-weight: 500;
      }
      .order-item-qty {
        color: var(--text-light);
        font-size: 0.9rem;
        margin-left: 0.5rem;
      }
      .order-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 1rem;
        border-top: 1px solid var(--gray-200);
        flex-wrap: wrap;
        gap: 1rem;
      }
      .order-total {
        font-size: 1.25rem;
        font-weight: bold;
        color: var(--primary);
      }
      .order-pickup {
        color: var(--text-light);
        font-size: 0.9rem;
      }
      .empty-orders {
        text-align: center;
        padding: 4rem 2rem;
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .empty-orders-icon {
        font-size: 4rem;
        margin-bottom: 1rem;
      }
      .filter-tabs {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
      }
      .filter-tab {
        padding: 0.5rem 1rem;
        border-radius: 8px;
        border: 2px solid var(--gray-200);
        background: white;
        color: var(--text-dark);
        cursor: pointer;
        font-weight: 500;
        transition: all 0.2s;
      }
      .filter-tab:hover {
        border-color: var(--primary);
        color: var(--primary);
      }
      .filter-tab.active {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }
    </style>
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar">
      <a href="index.html" class="navbar-brand">🥓 Boss Rainier Chicharon</a>
      <ul class="navbar-nav">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li>
          <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
        </li>
        <li id="auth-links">
          <a href="login.html">Login</a>
          <a href="register.html">Register</a>
        </li>
      </ul>
    </nav>

    <!-- ORDERS CONTENT -->
    <div class="orders-container">
      <div class="orders-header">
        <h1>📦 My Orders</h1>
        <p>Track your order history and pick-up status</p>
      </div>

      <!-- FILTER TABS -->
      <div class="filter-tabs" id="filter-tabs">
        <button class="filter-tab active" data-status="all">All Orders</button>
        <button class="filter-tab" data-status="pending">Pending</button>
        <button class="filter-tab" data-status="confirmed">Confirmed</button>
        <button class="filter-tab" data-status="ready">Ready</button>
        <button class="filter-tab" data-status="completed">Completed</button>
      </div>

      <!-- ORDERS LIST -->
      <div id="orders-list">
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading orders...</p>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
      <p>© 2026 Boss Rainier Chicharon. All rights reserved.</p>
      <p>Patubig, Marilao, Bulacan</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/orders.js"></script>
  </body>
</html>
