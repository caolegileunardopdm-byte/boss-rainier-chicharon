<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - Boss Rainier Chicharon</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar">
      <a href="index.html" class="navbar-brand">
        <img
          src="assets/logo.png"
          alt="Boss Rainier Chicharon"
          class="navbar-logo"
        />
        <span>Boss Rainier Chicharon</span>
      </a>
      <ul class="navbar-nav">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
    </nav>

    <!-- FORGOT PASSWORD -->
    <div class="auth-wrapper">
      <div class="auth-container">
        <div class="auth-panel active">
          <h1>🔐 Forgot Password?</h1>
          <p class="auth-subtitle">
            Enter your email and we'll send you an OTP code to reset your
            password.
          </p>

          <div id="alert" class="alert"></div>

          <form id="forgot-form">
            <div class="form-group">
              <label for="email">Email Address</label>
              <input
                type="email"
                id="email"
                placeholder="juan@example.com"
                required
              />
            </div>

            <button type="submit" class="btn btn-primary btn-block">
              Send OTP Code
            </button>
          </form>

          <p class="auth-footer">
            Remember your password?
            <a href="login.html">Back to Login</a>
          </p>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
      <p>© 2026 Boss Rainier Chicharon. All rights reserved.</p>
      <p>Patubig, Marilao, Bulacan</p>
    </footer>

    <script src="js/config.js"></script>
    <script>
      document
        .getElementById("forgot-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const email = document.getElementById("email").value.trim();
          const submitBtn = e.target.querySelector('button[type="submit"]');

          if (!email) {
            showAlert("Please enter your email", "danger");
            return;
          }

          submitBtn.disabled = true;
          submitBtn.textContent = "Sending OTP...";

          const result = await apiCall("/users/forgot-password", {
            method: "POST",
            body: JSON.stringify({ email }),
          });

          submitBtn.disabled = false;
          submitBtn.textContent = "Send OTP Code";

          if (!result.success) {
            showAlert(result.error || "Failed to send OTP", "danger");
            return;
          }

          showAlert("OTP sent! Redirecting...", "success");

          // Save email for next step
          sessionStorage.setItem("resetEmail", email);

          setTimeout(() => {
            window.location.href = "verify-otp.html?type=reset";
          }, 1500);
        });

      function showAlert(message, type) {
        const alertEl = document.getElementById("alert");
        alertEl.className = `alert alert-${type} show`;
        alertEl.textContent = message;
        setTimeout(() => alertEl.classList.remove("show"), 5000);
      }
    </script>
  </body>
</html>
