<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Boss Rainier Chicharon</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .auth-container {
        max-width: 420px;
        margin: 4rem auto;
        padding: 2.5rem 2rem;
        background: white;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }
      .auth-container h1 {
        color: var(--primary);
        text-align: center;
        margin-bottom: 0.5rem;
        font-size: 2rem;
      }
      .auth-container > p {
        text-align: center;
        color: var(--text-light);
        margin-bottom: 2rem;
      }
      .form-group {
        margin-bottom: 1.25rem;
      }
      .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: var(--text-dark);
        font-size: 0.95rem;
      }
      .form-group input {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 2px solid var(--gray-200);
        border-radius: 8px;
        font-size: 1rem;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
        background: white;
        color: var(--text-dark);
        font-family: inherit;
        box-sizing: border-box;
      }
      .form-group input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(146, 64, 14, 0.1);
      }
      .auth-link {
        text-align: center;
        margin-top: 1.5rem;
        color: var(--text-light);
        font-size: 0.95rem;
      }
      .alert {
        padding: 0.75rem 1rem;
        border-radius: 8px;
        margin-bottom: 1rem;
        display: none;
        font-size: 0.95rem;
      }
      .alert.show {
        display: block;
      }
      .alert-success {
        background: #d1fae5;
        color: #065f46;
        border: 1px solid #6ee7b7;
      }
      .alert-danger {
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fca5a5;
      }
    </style>
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar">
      <a href="index.html" class="navbar-brand">🥓 Boss Rainier Chicharon</a>
      <ul class="navbar-nav">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li>
          <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
        </li>
        <li><a href="login.html">Login</a></li>
        <li><a href="register.html">Register</a></li>
      </ul>
    </nav>

    <!-- LOGIN FORM -->
    <div class="auth-container">
      <h1>Welcome Back!</h1>
      <p>Login to your account</p>

      <div id="alert" class="alert"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="juan@example.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%">
          Login
        </button>
      </form>

      <p class="auth-link">
        Don't have an account? <a href="register.html">Register here</a>
      </p>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
      <p>© 2026 Boss Rainier Chicharon. All rights reserved.</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
      document.getElementById("cart-count").textContent = getCartCount();
    </script>
  </body>
</html>
