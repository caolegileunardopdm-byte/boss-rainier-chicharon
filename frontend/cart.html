<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart - Boss Rainier Chicharon</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .cart-container {
        max-width: 900px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      .cart-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
        flex-wrap: wrap;
        gap: 1rem;
      }
      .cart-header h1 {
        color: var(--primary);
        font-size: 2rem;
      }
      .cart-item {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr 1fr auto;
        gap: 1rem;
        align-items: center;
        background: white;
        padding: 1.25rem;
        border-radius: 12px;
        margin-bottom: 1rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .cart-item-name {
        font-weight: 600;
        color: var(--text-dark);
        font-size: 1.05rem;
      }
      .cart-item-price {
        color: var(--text-light);
        font-size: 0.9rem;
      }
      .qty-controls {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .qty-btn {
        width: 32px;
        height: 32px;
        border: 2px solid var(--gray-200);
        background: white;
        border-radius: 6px;
        cursor: pointer;
        font-size: 1.1rem;
        font-weight: bold;
        color: var(--primary);
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .qty-btn:hover {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }
      .qty-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .qty-value {
        min-width: 32px;
        text-align: center;
        font-weight: 600;
      }
      .cart-item-subtotal {
        font-weight: bold;
        color: var(--primary-light);
        font-size: 1.1rem;
      }
      .remove-btn {
        background: none;
        border: none;
        color: var(--danger);
        cursor: pointer;
        font-size: 1.25rem;
        padding: 0.25rem 0.5rem;
        border-radius: 6px;
        transition: background 0.2s;
      }
      .remove-btn:hover {
        background: #fee2e2;
      }
      .cart-summary {
        background: white;
        padding: 1.5rem;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        margin-top: 2rem;
      }
      .summary-row {
        display: flex;
        justify-content: space-between;
        padding: 0.75rem 0;
        border-bottom: 1px solid var(--gray-200);
      }
      .summary-row.total {
        font-size: 1.5rem;
        font-weight: bold;
        color: var(--primary);
        border-bottom: none;
        padding-top: 1rem;
      }
      .cart-actions {
        display: flex;
        gap: 1rem;
        margin-top: 1.5rem;
        flex-wrap: wrap;
      }
      .empty-cart {
        text-align: center;
        padding: 4rem 2rem;
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .empty-cart-icon {
        font-size: 4rem;
        margin-bottom: 1rem;
      }
      @media (max-width: 640px) {
        .cart-item {
          grid-template-columns: 1fr;
          text-align: center;
        }
        .qty-controls {
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar">
      <a href="index.html" class="navbar-brand"><img src="assets/logo.png" alt="Boss Rainier Chicharon" class="navbar-logo" /><span>Boss Rainier Chicharon</span></a>
      <ul class="navbar-nav">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li>
          <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
        </li>
        <li id="auth-links">
          <a href="login.html">Login</a>
          <a href="login.html#register">Register</a>
        </li>
      </ul>
    </nav>

    <!-- CART CONTENT -->
    <div class="cart-container">
      <div class="cart-header">
        <h1>🛒 Shopping Cart</h1>
        <a href="products.html" class="btn btn-primary">Continue Shopping</a>
      </div>

      <div id="cart-items">
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading cart...</p>
        </div>
      </div>

      <div id="cart-summary" style="display: none">
        <div class="cart-summary">
          <div class="summary-row">
            <span>Items:</span>
            <span id="summary-items">0</span>
          </div>
          <div class="summary-row total">
            <span>Total:</span>
            <span id="summary-total">₱0.00</span>
          </div>

          <div class="cart-actions">
            <button onclick="clearCart()" class="btn btn-secondary">
              🗑️ Clear Cart
            </button>
            <button
              onclick="checkout()"
              class="btn btn-primary"
              style="flex: 1"
            >
              Proceed to Checkout →
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
      <p>© 2026 Boss Rainier Chicharon. All rights reserved.</p>
      <p>Patubig, Marilao, Bulacan</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/cart.js"></script>
  </body>
</html>
