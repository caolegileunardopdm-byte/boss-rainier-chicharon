<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - Crispy Chicharon</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar">
      <a href="index.html" class="navbar-brand">
        <img
          src="assets/logo.png"
          alt="Crispy Chicharon"
          class="navbar-logo"
        />
        <span>Crispy Chicharon</span>
      </a>
      <ul class="navbar-nav">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
    </nav>

    <!-- RESET PASSWORD -->
    <div class="auth-wrapper">
      <div class="auth-container">
        <div class="auth-panel active">
          <h1>🔒 Reset Password</h1>
          <p class="auth-subtitle">Enter your new password below.</p>

          <div id="alert" class="alert"></div>

          <form id="reset-form">
            <div class="form-group">
              <label for="new-password">New Password</label>
              <input
                type="password"
                id="new-password"
                placeholder="Min 6 characters"
                required
              />
            </div>

            <div class="form-group">
              <label for="confirm-password">Confirm Password</label>
              <input
                type="password"
                id="confirm-password"
                placeholder="Re-enter your password"
                required
              />
            </div>

            <button type="submit" class="btn btn-primary btn-block">
              Reset Password
            </button>
          </form>

          <p class="auth-footer">
            <a href="login.html">← Back to Login</a>
          </p>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
      <p>© 2026 Crispy Chicharon. All rights reserved.</p>
      <p>Patubig, Marilao, Bulacan</p>
    </footer>

    <script src="js/config.js"></script>
    <script>
      document
        .getElementById("reset-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const newPassword = document.getElementById("new-password").value;
          const confirmPassword =
            document.getElementById("confirm-password").value;
          const submitBtn = e.target.querySelector('button[type="submit"]');

          if (newPassword.length < 6) {
            showAlert("Password must be at least 6 characters", "danger");
            return;
          }

          if (newPassword !== confirmPassword) {
            showAlert("Passwords do not match", "danger");
            return;
          }

          const email = sessionStorage.getItem("resetEmail");
          const otp = sessionStorage.getItem("resetOtp");

          if (!email || !otp) {
            showAlert("Session expired. Please start over.", "danger");
            setTimeout(() => {
              window.location.href = "forgot-password.html";
            }, 1500);
            return;
          }

          submitBtn.disabled = true;
          submitBtn.textContent = "Resetting...";

          const result = await apiCall("/users/reset-password", {
            method: "POST",
            body: JSON.stringify({ email, otp, newPassword }),
          });

          submitBtn.disabled = false;
          submitBtn.textContent = "Reset Password";

          if (!result.success) {
            showAlert(result.error || "Failed to reset password", "danger");
            return;
          }

          showAlert(
            "Password reset successfully! Redirecting to login...",
            "success",
          );

          // Clear session storage
          sessionStorage.removeItem("resetEmail");
          sessionStorage.removeItem("resetOtp");

          setTimeout(() => {
            window.location.href = "login.html";
          }, 1500);
        });

      function showAlert(message, type) {
        const alertEl = document.getElementById("alert");
        alertEl.className = `alert alert-${type} show`;
        alertEl.textContent = message;
        setTimeout(() => alertEl.classList.remove("show"), 5000);
      }
    </script>
  </body>
</html>
