<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify OTP - Boss Rainier Chicharon</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar">
      <a href="index.html" class="navbar-brand">
        <img
          src="assets/logo.png"
          alt="Boss Rainier Chicharon"
          class="navbar-logo"
        />
        <span>Boss Rainier Chicharon</span>
      </a>
      <ul class="navbar-nav">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
    </nav>

    <!-- OTP VERIFICATION -->
    <div class="auth-wrapper">
      <div class="auth-container">
        <div class="auth-panel active">
          <h1>🔑 Verify OTP</h1>
          <p class="auth-subtitle">
            Enter the 6-digit code sent to
            <strong id="email-display">your email</strong>
          </p>

          <div id="alert" class="alert"></div>

          <form id="otp-form">
            <div class="form-group">
              <label for="otp">OTP Code</label>
              <input
                type="text"
                id="otp"
                placeholder="000000"
                maxlength="6"
                pattern="[0-9]{6}"
                style="
                  text-align: center;
                  font-size: 1.5rem;
                  letter-spacing: 0.5rem;
                "
                required
              />
            </div>

            <button type="submit" class="btn btn-primary btn-block">
              Verify OTP
            </button>
          </form>

          <p class="auth-footer">
            Didn't receive the code?
            <a
              href="#"
              onclick="
                resendOtp();
                return false;
              "
              >Resend OTP</a
            >
          </p>

          <p class="auth-footer">
            <a href="login.html">← Back to Login</a>
          </p>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
      <p>© 2026 Boss Rainier Chicharon. All rights reserved.</p>
      <p>Patubig, Marilao, Bulacan</p>
    </footer>

    <script src="js/config.js"></script>
    <script>
      // Get URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const type = urlParams.get("type") || "reset"; // 'register' or 'reset'

      // Get email from sessionStorage
      const email =
        sessionStorage.getItem("resetEmail") ||
        sessionStorage.getItem("registerEmail");

      // Display email
      if (email) {
        document.getElementById("email-display").textContent = email;
      } else {
        document.getElementById("email-display").textContent = "your email";
      }

      // Handle OTP submission
      document
        .getElementById("otp-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const otp = document.getElementById("otp").value.trim();
          const submitBtn = e.target.querySelector('button[type="submit"]');

          if (!otp || otp.length !== 6) {
            showAlert("Please enter a valid 6-digit OTP", "danger");
            return;
          }

          submitBtn.disabled = true;
          submitBtn.textContent = "Verifying...";

          const endpoint =
            type === "register"
              ? "/users/verify-registration-otp"
              : "/users/verify-reset-otp";

          const result = await apiCall(endpoint, {
            method: "POST",
            body: JSON.stringify({ email, otp }),
          });

          submitBtn.disabled = false;
          submitBtn.textContent = "Verify OTP";

          if (!result.success) {
            showAlert(result.error || "Invalid OTP", "danger");
            return;
          }

          showAlert("OTP verified! Redirecting...", "success");

          // Save OTP for reset password step
          if (type === "reset") {
            sessionStorage.setItem("resetOtp", otp);
            setTimeout(() => {
              window.location.href = "reset-password.html";
            }, 1500);
          } else {
            // For registration, just go to login
            sessionStorage.removeItem("registerEmail");
            setTimeout(() => {
              window.location.href = "login.html";
            }, 1500);
          }
        });

      // Resend OTP
      async function resendOtp() {
        if (!email) {
          showAlert("Email not found. Please try again.", "danger");
          return;
        }

        const result = await apiCall("/users/resend-otp", {
          method: "POST",
          body: JSON.stringify({ email, type }),
        });

        if (!result.success) {
          showAlert(result.error || "Failed to resend OTP", "danger");
          return;
        }

        showAlert("New OTP sent! Check your terminal.", "success");
      }

      function showAlert(message, type) {
        const alertEl = document.getElementById("alert");
        alertEl.className = `alert alert-${type} show`;
        alertEl.textContent = message;
        setTimeout(() => alertEl.classList.remove("show"), 5000);
      }
    </script>
  </body>
</html>
