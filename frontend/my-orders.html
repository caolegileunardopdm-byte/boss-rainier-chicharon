<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Orders - Crispy Chicharon</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/my-orders.css" />
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar">
      <a href="index.html" class="navbar-brand">
        <img src="assets/logo.png" alt="Crispy Chicharon" class="navbar-logo" />
        <span>Crispy Chicharon</span>
      </a>
      <ul class="navbar-nav">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="my-orders.html" class="active">My Orders</a></li>
        <li>
          <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
        </li>
        <li id="auth-links">
          <a href="login.html">Login</a>
        </li>
      </ul>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="my-orders-container">
      <h1 class="page-title">📦 My Orders</h1>
      <p class="page-subtitle">Track your orders and view their status</p>

      <!-- FILTER TABS -->
      <div class="filter-tabs">
        <button
          class="filter-tab active"
          data-status="all"
          onclick="filterOrders('all')"
        >
          All
        </button>
        <button
          class="filter-tab"
          data-status="pending"
          onclick="filterOrders('pending')"
        >
          Pending
        </button>
        <button
          class="filter-tab"
          data-status="confirmed"
          onclick="filterOrders('confirmed')"
        >
          Confirmed
        </button>
        <button
          class="filter-tab"
          data-status="ready"
          onclick="filterOrders('ready')"
        >
          Ready
        </button>
        <button
          class="filter-tab"
          data-status="completed"
          onclick="filterOrders('completed')"
        >
          Completed
        </button>
        <button
          class="filter-tab"
          data-status="cancelled"
          onclick="filterOrders('cancelled')"
        >
          Cancelled
        </button>
      </div>

      <!-- ORDERS LIST -->
      <div id="orders-list">
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading your orders...</p>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
      <p>© 2026 Crispy Chicharon. All rights reserved.</p>
    </footer>

    <!-- ==================== CUSTOM CONFIRM MODAL ==================== -->
    <!-- BAGONG CONFIRM MODAL -->
    <div id="confirm-modal" class="modal">
      <div
        class="modal-content"
        style="
          text-align: center;
          max-width: 400px;
          padding: 2rem;
          border-radius: 12px;
        "
      >
        <div style="font-size: 3rem; margin-bottom: 1rem">⚠️</div>
        <h2
          id="confirm-title"
          style="margin-bottom: 1rem; color: #333; font-size: 1.5rem"
        >
          Cancel Order?
        </h2>
        <div
          id="confirm-message"
          style="margin-bottom: 2rem; color: #666"
        ></div>

        <div style="display: flex; gap: 1rem; justify-content: center">
          <button
            onclick="closeConfirmModal()"
            style="
              padding: 0.75rem 1.5rem;
              border: none;
              border-radius: 8px;
              cursor: pointer;
              font-weight: bold;
              background: #e5e7eb;
              color: #374151;
              flex: 1;
            "
          >
            No, Keep it
          </button>
          <button
            id="confirm-ok-btn"
            style="
              padding: 0.75rem 1.5rem;
              border: none;
              border-radius: 8px;
              cursor: pointer;
              font-weight: bold;
              background: #ef4444;
              color: white;
              flex: 1;
            "
          >
            Yes, Cancel Order
          </button>
        </div>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/my-orders.js"></script>
  </body>
</html>
